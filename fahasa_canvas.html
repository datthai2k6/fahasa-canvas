<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FAHASA Heritage Passage · Layout Studio</title>
<style>
:root{--ink:#f5eee4;--muted:#bdb1a1;--panel:#1b1612;--glass:rgba(22,18,15,.86);--line:rgba(255,214,170,.15);--accent:#ffb46b;--accent-2:#d9692f;--field:#120f0c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#100d0b;color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.glabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.group .glabel{margin-top:0}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.45}
.grow{flex:1}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.2;white-space:nowrap}
.btn:hover{background:rgba(255,180,107,.12);border-color:rgba(255,180,107,.45)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#24160b;font-weight:600}
.btn.danger{color:#ffb4a4}.btn.danger:hover{background:rgba(220,70,50,.18);border-color:#c0503a}
.btn.on{background:rgba(255,180,107,.2);border-color:rgba(255,180,107,.6);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:rgba(255,180,107,.18);color:var(--accent);font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);border-color:transparent}
input[type=color]{width:44px;height:26px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:1px;cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.f{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
.f>span{font-size:12px;color:var(--muted)}
.crow{display:flex;gap:6px;align-items:center}
.g2,.g3,.g4{display:grid;gap:6px;margin:6px 0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2 label,.g3 label,.g4 label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* Top bar */
#top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#15110e;border-bottom:1px solid var(--line);z-index:40}
#top .brand{display:flex;flex-direction:column;min-width:140px;flex:0 1 340px}
#projName{background:transparent;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:1px 0;font-size:14px;font-weight:650}
#projName:hover,#projName:focus{border-bottom-color:var(--line);outline:none}
.tools{display:flex;gap:6px;align-items:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
#saveState{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
/* Layout */
#main{position:fixed;top:52px;left:0;right:0;bottom:0;display:grid;grid-template-columns:280px minmax(0,1fr) minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr)}
#left{grid-column:1}#planWrap{grid-column:2}#view3d{grid-column:3}#right{grid-column:4}
#main.v-plan #planWrap{grid-column:2/4}#main.v-plan #view3d{display:none}
#main.v-3d #view3d{grid-column:2/4}#main.v-3d #planWrap{display:none}
body.present #top,body.present #left,body.present #right,body.present #planWrap{display:none}
body.present #main{top:0}body.present #view3d{display:block;grid-column:1/-1}
.side{background:var(--panel);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);overflow:auto;padding:14px}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;background:transparent;padding:11px 4px;font-size:12px;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab{display:none;overflow:auto;padding:12px 14px 24px;min-height:0;flex:1}
.tab.on{display:block}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.libItem{display:flex;gap:7px;align-items:center;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:8px;padding:7px 8px;font-size:12px;line-height:1.2}
.libItem:hover{border-color:rgba(255,180,107,.5);background:rgba(255,180,107,.08)}
.sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.25)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:rgba(255,255,255,.02)}
.card.on{border-color:rgba(255,180,107,.55)}
.card .head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card .head b{flex:1;font-size:13px}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ph .pt{font-size:15px;font-weight:650}
.hsList{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:3px}
.hsList li{display:flex;align-items:center;gap:4px;border-radius:8px}
.hsList li.on{background:rgba(255,180,107,.12)}
.hsSel{flex:1;display:flex;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:8px;min-width:0}
.hsSel:hover{background:rgba(255,255,255,.05)}
.hsSel .t{display:flex;flex-direction:column;min-width:0}
.hsSel .t b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsSel .t small{color:var(--muted);font-size:11px}
.mv{display:flex;gap:2px}.mv button{border:1px solid var(--line);background:transparent;border-radius:6px;width:24px;height:24px;padding:0;font-size:12px}
.n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-2);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
/* Plan */
#planWrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#16120f}
.pbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:#191410}
.pbar label{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.pbar select{width:auto}
#planBox{position:relative;flex:1;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#planInfo{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none;background:rgba(16,13,11,.75);padding:3px 8px;border-radius:6px}
/* 3D */
#view3d{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0d0b0a}
#view3d>canvas{display:block}
#labels{position:absolute;top:0;left:0;pointer-events:none;z-index:2}
.vbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;pointer-events:none}
.vbar>*{pointer-events:auto;background:var(--glass);backdrop-filter:blur(8px)}
.vbar select{width:auto}
body.present .vbar{display:none}
/* Present mode */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 32px rgba(0,0,0,.35)}
#presenter{position:fixed;top:16px;left:16px;bottom:58px;width:320px;display:none;flex-direction:column;gap:10px;z-index:20;pointer-events:none}
body.present #presenter{display:flex}
#presenter .panel{pointer-events:auto}
#pBrand{padding:14px 16px;flex:none}
#pBrand h1{margin:5px 0 3px;font-size:18px;line-height:1.25;font-weight:650}
#pBrand p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
#pControls{padding:12px 14px 14px;overflow:auto;min-height:0;flex:0 1 auto}
.group{margin-top:14px}.group:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 11px;font-size:12px}
.chip:hover{background:rgba(255,180,107,.12);border-color:rgba(255,180,107,.4)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#24160b;font-weight:600}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:44px;height:24px;border-radius:999px;background:#7fb2d6;position:relative;transition:background .3s;flex:none}
.knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff8e6;transition:transform .3s,background .3s}
.switch input:checked+.track{background:#2a2f55}
.switch input:checked+.track .knob{transform:translateX(20px);background:var(--accent)}
.cta{width:100%;border:0;border-radius:10px;padding:10px 12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#24160b;font-weight:650;font-size:13px}
.cta.playing{background:rgba(255,255,255,.08);color:var(--ink);outline:1px solid var(--line)}
#poi{list-style:none;margin:0;padding:0;display:grid;gap:1px}
#poi li.lv{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:9px 0 3px}
#poi li.lv:first-child{margin-top:0}
#poi button{width:100%;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:7px;font-size:12.5px;display:flex;gap:8px;align-items:center}
#poi button:hover{background:rgba(255,255,255,.06)}
#info{position:fixed;z-index:21;top:16px;right:16px;width:360px;max-height:calc(100% - 32px);overflow:auto;padding:18px 18px 16px;transform:translateX(calc(100% + 40px));transition:transform .35s ease}
#info.open{transform:none}
#closeInfo{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.meta{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#iNum{width:26px;height:26px;border-radius:50%;background:var(--accent-2);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:0}
#info h2{margin:12px 0 2px;font-size:19px;line-height:1.25;padding-right:26px}
#iVn{font-style:italic;color:var(--accent);font-size:13px}
#iText{font-size:13.5px;line-height:1.55;color:#e9e0d3;margin:12px 0}
#iList{margin:0;padding:0;list-style:none;display:grid;gap:6px}
#iList li{font-size:13px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.05);border-left:3px solid var(--accent)}
#iTour{margin-top:12px;font-size:11.5px;color:var(--muted)}
#hint{position:fixed;z-index:9;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);padding:7px 14px;border-radius:999px;white-space:nowrap;display:none}
body.present #hint{display:block}
.hs{pointer-events:auto;width:28px;height:28px;border-radius:50%;border:2px solid #fff8ee;background:var(--accent-2);color:#fff;font:700 12px/1 system-ui,sans-serif;cursor:pointer;padding:0;box-shadow:0 3px 12px rgba(0,0,0,.45)}
.hs::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);animation:pulse 2.2s ease-out infinite;pointer-events:none}
.hs:hover,.hs.active{background:var(--accent);color:#24160b}
.hs .tip{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);white-space:nowrap;background:var(--glass);border:1px solid var(--line);color:var(--ink);padding:5px 9px;border-radius:7px;font:500 12px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}
.hs:hover .tip{opacity:1}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.lvl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(20,16,13,.75);border:1px solid var(--line);padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none}
.lvl b{color:var(--accent);font-weight:700;margin-right:6px}
#loader{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#0d0b0a;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;transition:.3s;background:#2a211b;border:1px solid var(--line);padding:9px 14px;border-radius:10px;z-index:70;font-size:12.5px;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1200px){#main{grid-template-columns:240px minmax(0,1fr) minmax(0,1fr) 270px}}
@media (max-width:760px){#presenter{top:10px;left:10px;right:10px;bottom:auto;width:auto;max-height:58%}#pBrand p{display:none}#info{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:48%;transform:translateY(calc(100% + 30px))}#info.open{transform:none}}
</style>
</head>
<body>
<div id="loader">Loading layout studio…</div>

<header id="top">
  <div class="brand"><span class="eyebrow">Layout studio</span><input id="projName" type="text" spellcheck="false" aria-label="Project name"></div>
  <div class="seg" id="modeSeg"><button data-mode="edit" class="on">Edit</button><button data-mode="present">Present</button></div>
  <div class="tools">
    <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn" id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
    <span class="sep"></span>
    <button class="btn" id="importBtn" title="Open a layout file (.json)">Import</button>
    <button class="btn" id="exportBtn" title="Download this layout as a file (.json)">Export</button>
    <button class="btn danger" id="resetBtn" title="Go back to the original FAHASA layout">Reset</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
  <div class="grow"></div>
  <div id="saveState"></div>
</header>

<main id="main">
  <aside id="left" class="side">
    <nav class="tabs" id="tabs"><button data-tab="lib" class="on">Library</button><button data-tab="floors">Floors</button><button data-tab="hs">Hotspots</button><button data-tab="style">Colours</button></nav>
    <div class="tab on" id="tab-lib"></div><div class="tab" id="tab-floors"></div><div class="tab" id="tab-hs"></div><div class="tab" id="tab-style"></div>
  </aside>
  <section id="planWrap">
    <div class="pbar"><div class="seg" id="levelTabs"></div><div class="grow"></div>
      <div class="seg" id="viewSeg"><button data-v="plan">Plan</button><button data-v="split" class="on">Split</button><button data-v="3d">3D</button></div></div>
    <div class="pbar">
      <label><input type="checkbox" id="snapChk" checked> Snap</label>
      <select id="snapStep"><option value="0.05">5 cm</option><option value="0.1" selected>10 cm</option><option value="0.25">25 cm</option><option value="0.5">50 cm</option><option value="1">1 m</option></select>
      <label><input type="checkbox" id="labelChk" checked> Labels</label>
      <label><input type="checkbox" id="ghostChk" checked> Floor below</label>
      <div class="grow"></div>
      <button class="btn" id="fitBtn" title="Fit plan (F)">Fit</button><button class="btn" id="planPng" title="Download the plan as an image">PNG</button>
    </div>
    <div id="planBox"><canvas id="plan"></canvas><div id="planInfo"></div></div>
  </section>
  <section id="view3d">
    <div class="vbar">
      <button class="btn" id="lightBtn">☀ Day</button>
      <div class="seg" id="wallSeg"><button data-walls="solid">Solid</button><button data-walls="cutaway" class="on">Cutaway</button><button data-walls="hidden">Hidden</button></div>
      <select id="floorsSel" class="btn"><option value="below">Current floor &amp; below</option><option value="all">All floors</option></select>
      <button class="btn on" id="markBtn">Hotspots</button>
      <button class="btn" id="focusBtn">Focus floor</button>
      <button class="btn" id="shotBtn" title="Download the 3D view as an image">PNG</button>
    </div>
  </section>
  <aside id="right" class="side"><div id="props"></div></aside>
</main>

<div id="presenter">
  <header id="pBrand" class="panel"><div class="eyebrow">Concept visualisation</div><h1 id="pTitle"></h1><p id="pSub"></p></header>
  <section id="pControls" class="panel">
    <div class="group"><button class="btn" id="backEdit" style="width:100%">← Back to editing</button></div>
    <div class="group"><div class="glabel">Camera</div><div class="chips" id="pViews"></div></div>
    <div class="group"><div class="glabel">Show floors</div><div class="chips" id="pLevels"></div></div>
    <div class="group"><div class="glabel">Walls</div><div class="seg" id="pWalls"><button data-walls="solid">Solid</button><button data-walls="cutaway" class="on">Cutaway</button><button data-walls="hidden">Hidden</button></div></div>
    <div class="group"><div class="glabel">Lighting</div><label class="switch"><input type="checkbox" id="evening"><span class="track"><span class="knob"></span></span><span id="lightLbl">Day · architectural study</span></label></div>
    <div class="group"><button id="tourBtn" class="cta" type="button">▶ Walk the customer journey</button></div>
    <div class="group"><div class="glabel">Points of interest</div><ol id="poi"></ol></div>
  </section>
</div>
<aside id="info" class="panel" aria-live="polite">
  <button id="closeInfo" type="button" aria-label="Close">×</button>
  <div class="meta"><span id="iNum"></span><span id="iLevel"></span></div>
  <h2 id="iTitle"></h2><div id="iVn"></div><p id="iText"></p><ul id="iList"></ul><div id="iTour"></div>
</aside>
<div id="hint" class="panel">Drag to orbit · Scroll to zoom · Right-drag to pan · Click a numbered marker</div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   1. UTILITIES
   ===================================================================== */
const $ = s => document.querySelector(s);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), Q0 = new THREE.Quaternion();
const yQ = a => new THREE.Quaternion().setFromAxisAngle(UP, a);
const mtx = (x, y, z, sx, sy, sz, q = Q0) => new THREE.Matrix4().compose(V(x, y, z), q, V(sx, sy, sz));
const BASE = (x, y, z, a = 0) => new THREE.Matrix4().compose(V(x, y, z), yQ(a), V(1, 1, 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rad = d => d * Math.PI / 180;
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => String(r2(v));
const uid = () => Math.random().toString(36).slice(2, 10);
const deep = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normRot = a => { a = ((a % 360) + 360) % 360; return r2(a > 180 ? a - 360 : a); };
function rng(seed) {
  let s = seed | 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h; }
const pick = (r, a) => a[Math.floor(r() * a.length)];

// One unit of merchandise at local (x, y, z), yaw a. Unit's local x runs along the row.
function unit(b, merch, x, y, z, a, i, maxH = 1) {
  const r = b.rng, B0 = BASE(x, y, z, a);
  const p = (geo, mk, lx, ly, lz, sx, sy, sz, c) => b.add(geo, mk, B0.clone().multiply(mtx(lx, ly, lz, sx, sy, sz)), c);
  let m = merch;
  if (m === 'gourmet') m = ['tea', 'coffee', 'jar'][((i % 3) + 3) % 3];
  else if (m === 'craft') m = ['ceramics', 'lacquer', 'nonla'][((i % 3) + 3) % 3];
  switch (m) {
    case 'books': case 'leather': {
      const pal = m === 'leather' ? LEATHER : BOOK, n = 1 + Math.floor(r() * 4);
      for (let k = 0; k < n && (k + 1) * .035 <= maxH; k++) p('box', 'white', 0, .017 + k * .035, 0, .24, .033, .32, pick(r, pal));
      break;
    }
    case 'coffee': for (const j of [-1, 1]) p('box', 'white', j * .14, .14, 0, .12, .28, .2, IC.coffee); break;
    case 'tea': for (let j = -1; j <= 1; j++) p('cyl', 'tin', j * .15, .08, 0, .06, .16, .06, IC.tea); break;
    case 'jar': p('cyl', 'white', 0, .19, 0, .16, .38, .16, IC.kraft); p('cyl', 'white', 0, .39, 0, .13, .02, .13, IC.beans); break;
    case 'jars': { const s = Math.min(1, maxH / .22); p('cyl', 'ceramic', 0, .1 * s, 0, .07, .2 * s, .07, i % 2 ? IC.jarB : IC.jarA); break; }
    case 'ceramics': { const s = Math.max(.3, Math.min(maxH / .42, .7 + r() * .45)); p('vase', 'ceramic', 0, 0, 0, s, s, s, r() < .5 ? IC.cerW : IC.cerB); break; }
    case 'lacquer': p('box', 'gloss', 0, .06, 0, .3, .12, .24, IC.lacquer); p('box', 'goldI', 0, .13, 0, .3, .02, .24, IC.gold); break;
    case 'nonla': p('cyl', 'white', 0, .05, 0, .04, .1, .04, IC.walnut); p('hat', 'hatI', 0, .165, 0, 1, 1, 1, IC.nonla); break;
    case 'stationery':
      if (r() < .65) { const c = pick(r, SILK), n = 1 + Math.floor(r() * 3); for (let k = 0; k < n; k++) p('box', 'white', 0, .012 + k * .024, 0, .2, .022, .15, c); }

      break;
    case 'postcards': for (let k = 0; k < 2; k++) p('box', 'white', (k - .5) * .1, .015, 0, .09, .03, .14, pick(r, CARD)); break;
    case 'vinyl': { const n = 2 + Math.floor(r() * 4); for (let k = 0; k < n; k++) p('box', 'white', 0, .006 + k * .012, 0, .31, .01, .31, pick(r, SLEEVE)); break; }
  }
}
// Standing books / editions / records along local x, backed at zBack, extending in direction dir (±1 on z)
function standRow(b, merch, x0, x1, y, zBack, dir, maxH, maxD, fill) {
  const r = b.rng, pal = merch === 'leather' ? LEATHER : merch === 'vinyl' ? SLEEVE : BOOK;
  let x = x0;
  while (x < x1 - .04) {
    const t = merch === 'vinyl' ? .012 : merch === 'leather' ? .055 : .035 + r() * .045;
    if (r() > fill) { x += t + .05; continue; }
    const h = Math.max(.05, Math.min(maxH - .03, merch === 'vinyl' ? .31 : merch === 'leather' ? .28 : .2 + r() * .13));
    const d = Math.max(.05, Math.min(maxD, merch === 'vinyl' ? .31 : .16 + r() * .08));
    b.add('box', 'white', mtx(x + t / 2, y + h / 2, zBack + dir * (d / 2 + .02), t, h, d), pick(r, pal));

// Evenly spaced units along local x
function unitRow(b, merch, x0, x1, y, z, fill, maxH, a = 0, i0 = 0, uw = 0) {

  const w = uw || UNIT_W[merch] || .4, n = Math.floor((x1 - x0) / w + .001);
  if (n < 1) return;
  const step = (x1 - x0) / n;
  for (let i = 0; i < n; i++) if (b.rng() <= fill) unit(b, merch, x0 + step * (i + .5), y, z, a, i0 + i, maxH);

// One shelf row: standing books (optionally with accent goods every ~3 m) or units
function shelfRow(b, merch, x0, x1, y, zBack, dir, maxH, maxD, fill, accent = 'none', row = 0) {
  if (!merch || merch === 'none' || x1 - x0 < .1) return;
  if (!STANDING.has(merch)) { unitRow(b, merch, x0, x1, y, zBack + dir * (maxD / 2 + .02), fill, maxH, 0, row); return; }
  if (accent && accent !== 'none' && row % 2 === 1) {
    const span = x1 - x0, n = Math.max(1, Math.round(span / 3)), gap = (UNIT_W[accent] || .45) + .1;
    let x = x0;
    for (let k = 0; k < n; k++) {
      const xc = x0 + span * (k + .5) / n;
      standRow(b, merch, x, xc - gap / 2, y, zBack, dir, maxH, maxD, fill);
      unit(b, accent, xc, y, zBack + dir * (maxD / 2 + .02), 0, k + row, maxH);
      x = xc + gap / 2;
    }
    standRow(b, merch, x, x1, y, zBack, dir, maxH, maxD, fill);
  } else standRow(b, merch, x0, x1, y, zBack, dir, maxH, maxD, fill);
}

/* ---------- Fixture records ---------- */
function makeFixture(t, o = {}, level = 'g') {
  return { id: uid(), type: t, level, x: 0, z: 0, rot: 0, elev: 0, label: '', ...deep(TYPES[t].def), ...deep(o) };
}
function normFixture(f) {
  const T = f && TYPES[f.type];
  if (!T) return null;
  const n = { id: uid(), level: 'g', x: 0, z: 0, rot: 0, elev: 0, label: '', ...deep(T.def), ...f };
  if (!n.id) n.id = uid();
  ['x', 'z', 'rot', 'elev', 'w', 'd', 'h'].forEach(k => { n[k] = Number(n[k]); if (!isFinite(n[k])) n[k] = T.def[k] ?? 0; });
  n.w = Math.max(.05, n.w); n.d = Math.max(.02, n.d);
  return n;
}
const planOf = t => (TYPES[t] && TYPES[t].plan) || PL.base;

  const add = (level, type, o) => { const f = makeFixture(type, o, level); f.x = r2(f.x); f.z = r2(f.z); f.w = r2(f.w); fx.push(f); return f; };

  const b = s.building || {};

/* ---------- History (undo / redo) ---------- */
const hist = { stack: [], idx: -1 };
function commit() {
  const s = JSON.stringify(state);
  if (hist.stack[hist.idx] === s) return;
  hist.stack.length = hist.idx + 1;
  hist.stack.push(s);
  if (hist.stack.length > 150) hist.stack.shift();
  hist.idx = hist.stack.length - 1;
  scheduleSave(); updateHistoryButtons();
}
function restoreSnapshot(s) {
  state = JSON.parse(s);
  ui.sel = ui.sel.filter(id => fxById(id));
  if (ui.selHs && !hsById(ui.selHs)) ui.selHs = null;
  if (!lvl(ui.level)) ui.level = levelsSorted()[0].id;
  rebuildAll(); scheduleSave(); updateHistoryButtons();
}
function undo() { if (hist.idx > 0) { hist.idx--; restoreSnapshot(hist.stack[hist.idx]); } }
function redo() { if (hist.idx < hist.stack.length - 1) { hist.idx++; restoreSnapshot(hist.stack[hist.idx]); } }
function updateHistoryButtons() { $('#undoBtn').disabled = hist.idx <= 0; $('#redoBtn').disabled = hist.idx >= hist.stack.length - 1; }
// Every edit ends here: refresh 3D + plan + panels, then record an undo step
function changed(o = {}) { sync(); drawPlan(); if (o.panels !== false) refreshPanels(); if (o.commit !== false) commit(); }

/* ---------- Auto-save, import, export, reset ---------- */
let saveTimer = 0, savePending = false;
const setSaveText = t => { $('#saveState').textContent = t; };
function scheduleSave() { savePending = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); setSaveText('Saving…'); }
function saveNow() {
  clearTimeout(saveTimer); savePending = false;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); setSaveText('Auto-saved in this browser · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })); }
  catch (e) { setSaveText('Auto-save not available here · use Export to keep your work'); }
}
addEventListener('beforeunload', () => { if (savePending) saveNow(); });
function startState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return { s: normState(JSON.parse(raw)), restored: true }; }
  catch (e) { /* unreadable save: fall back to the original layout */ }
  return { s: normState(defaultState()), restored: false };
}
function replaceState(raw) {
  state = normState(raw);
  setSel([]);
  if (!lvl(ui.level)) ui.level = levelsSorted()[0].id;
  rebuildAll(); commit();
}
function exportLayout() {
  saveNow();
  const data = JSON.stringify({ ...state, exported: new Date().toISOString() }, null, 1);
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const slug = (state.name || 'layout').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'layout';
  download(url, `${slug}-${new Date().toISOString().slice(0, 10)}.json`);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Layout file downloaded. Use Import to open it again or share it.');
}

$('#redoBtn').onclick = () => redo();
$('#exportBtn').onclick = () => exportLayout();

/* ---------- Editing actions (used by the plan, keyboard and panels) ---------- */
function addFixture(t, o = {}, at = null) {

}
function deleteSel() {
  if (ui.selHs) { state.hotspots = state.hotspots.filter(h => h.id !== ui.selHs); setSel([]); changed(); return; }
  if (!ui.sel.length) return;
  const del = new Set(ui.sel);
  state.fixtures = state.fixtures.filter(f => !del.has(f.id)); setSel([]); changed();
}
function duplicateSel(dx = .5, dz = .5) {

  const copies = src.map(f => ({ ...deep(f), id: uid(), x: r2(f.x + dx), z: r2(f.z + dz) }));
  state.fixtures.push(...copies); setSel(copies.map(f => f.id)); changed();
}

  const src = selFx(); if (!src.length) return;

}
function pasteClip() {

  const off = ui.clip.every(f => f.level === ui.level) ? .5 : 0;
  const copies = ui.clip.map(f => ({ ...deep(f), id: uid(), level: ui.level, x: r2(f.x + off), z: r2(f.z + off) }));
  state.fixtures.push(...copies); ui.clip = deep(copies); setSel(copies.map(f => f.id)); changed();

}
function rotateSel(deg) {
  const src = selFx(); if (!src.length) return;
  if (src.length === 1) src[0].rot = normRot(src[0].rot + deg);
  else {
    const cx = src.reduce((s, f) => s + f.x, 0) / src.length, cz = src.reduce((s, f) => s + f.z, 0) / src.length;
    const t = rad(deg), c = Math.cos(t), s = Math.sin(t);
    src.forEach(f => { const dx = f.x - cx, dz = f.z - cz; f.x = r2(cx + dx * c + dz * s); f.z = r2(cz - dx * s + dz * c); f.rot = normRot(f.rot + deg); });

}

  const src = selFx(); if (!src.length) return;
  src.forEach(f => { f.x = r2(f.x + dx); f.z = r2(f.z + dz); }); changed();
}

  src.forEach(f => { f.level = id; }); ui.level = id; changed();
  toast(`${src.length} item${src.length > 1 ? 's' : ''} moved to ${levelName(lvl(id))}`);
}
function addHotspot(at = null) {

function addLevel(kind = 'floor') {

/* =====================================================================
   8. 3D WORLD — built from the layout data, kept in sync after each edit
   ===================================================================== */
const world = { levels: new Map(), fx: new Map(), lights: [], hs: new Map(), hsKey: '', ctxKey: '', ctxLight: null, context: new THREE.Group() };
scene.add(world.context);
let styleRev = 0, presActive = null;
const presVis = {};   // present mode: levelId → false when hidden

function levelVisible(id) {

function levelRec(id) {

/* ---------- Street & neighbours ---------- */
function syncContext() {
  const B = state.building, key = JSON.stringify([B.width, B.depth, B.street]);
  if (key === world.ctxKey) return;
  world.ctxKey = key;
  world.context.children.slice().forEach(ch => { world.context.remove(ch); disposeGroup(ch); });
  if (world.ctxLight) { world.lights.splice(world.lights.indexOf(world.ctxLight), 1); scene.remove(world.ctxLight); world.ctxLight.dispose(); world.ctxLight = null; }
  const g = new THREE.Group(), b = new Builder(g, { id: 'context', type: 'box' }), HX = B.width / 2, HZ = B.depth / 2;
  const road = b.mesh(new THREE.PlaneGeometry(800, 800), MAT.road); road.rotation.x = -Math.PI / 2; road.position.y = -.05; road.castShadow = false;
  if (B.street) {
    const pw = 2 * (HX + 80), pav = b.mesh(new THREE.PlaneGeometry(pw, 46), MAT.paving);
    pav.rotation.x = -Math.PI / 2; pav.position.set(0, -.02, HZ + 23); pav.castShadow = false;
    MAT.paving.map.repeat.set(pw / 4, 11.5);
    const NB = ['#d6cdbd', '#c9c1b5', '#dccab0', '#c3c8c6', '#d4c9b8', '#cbbfae'];
    const nb = (x0, x1, h, i) => {
      b.add('box', 'white', mtx((x0 + x1) / 2, h / 2, -1.2, x1 - x0, h, 2 * HZ + 1.6), NB[i % 6]);
      for (let y = 1.2; y < h - 1; y += 3.2) b.box('win', x0 + .6, x1 - .6, y, y + 1.6, HZ - .4, HZ - .32);
    };
    let x = -HX - .2;
    [[11.05, 11.5], [11, 10], [11, 12]].forEach(([w, h], i) => { nb(x - w, x, h, i); x -= w; });
    x = HX + .2;
    [[11.05, 10.5], [11, 12.5], [11, 9.5]].forEach(([w, h], i) => { nb(x, x + w, h, i + 3); x += w; });
    const tree = (tx, tz) => { b.add('trunk', 'trunk', BASE(tx, 1.5, tz)); b.add('crown', 'tree', new THREE.Matrix4().compose(V(tx, 4.2, tz), yQ(b.rng() * 6), V(1, .85, 1))); };
    for (let k = 0; 5.5 + 11 * k <= HX + 32; k++) [-1, 1].forEach(s => tree(s * (5.5 + 11 * k), HZ + 12));
    for (let k = 0; 11 * k <= HX + 32; k++) (k ? [-1, 1] : [1]).forEach(s => tree(s * 11 * k, HZ + 30));
    for (let k = 0; 4 + 8 * k <= HX + 26; k++) [-1, 1].forEach(s => {
      const lx = s * (4 + 8 * k);
      b.add('cyl8', 'metal', mtx(lx, 2.1, HZ + 3.5, .07, 4.2, .07));
      b.add('sphere', 'lamp', mtx(lx, 4.35, HZ + 3.5, .28, .28, .28));
    });
    const pl = new THREE.PointLight(styleColor('led'), 0, 20, 2);
    pl.position.set(B.doorX, 3.2, HZ + 3); pl.userData = { base: 26, level: null };
    scene.add(pl); world.lights.push(pl); world.ctxLight = pl;

/* ---------- Floor shells: slab (with openings), perimeter walls, facade ---------- */
function slabPieces(R, holes) {
  const xs = new Set([R.x0, R.x1]), zs = new Set([R.z0, R.z1]);
  holes.forEach(h => {
    [h.x0, h.x1].forEach(v => { if (v > R.x0 && v < R.x1) xs.add(v); });
    [h.z0, h.z1].forEach(v => { if (v > R.z0 && v < R.z1) zs.add(v); });
  });
  const X = [...xs].sort((a, b) => a - b), Z = [...zs].sort((a, b) => a - b), out = [];
  for (let j = 0; j < Z.length - 1; j++) {
    const zm = (Z[j] + Z[j + 1]) / 2; let run = null;
    for (let i = 0; i < X.length - 1; i++) {
      const xm = (X[i] + X[i + 1]) / 2, solid = !holes.some(h => xm > h.x0 && xm < h.x1 && zm > h.z0 && zm < h.z1);
      if (solid) { if (run) run.x1 = X[i + 1]; else run = { x0: X[i], x1: X[i + 1], z0: Z[j], z1: Z[j + 1] }; }
      else if (run) { out.push(run); run = null; }
    }
    if (run) out.push(run);
  }
  return out;
}
function voidBoxes(id) {
  return fxOn(id).filter(f => f.type === 'void').map(f => {
    const cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, c]) => toWorld(f, a * f.w / 2, c * f.d / 2));
    return { x0: Math.min(...cs.map(p => p.x)), x1: Math.max(...cs.map(p => p.x)), z0: Math.min(...cs.map(p => p.z)), z1: Math.max(...cs.map(p => p.z)) };
  });
}
function buildShell(L) {
  const g = new THREE.Group(), b = new Builder(g, { id: 'shell-' + L.id, type: 'box' }), B = state.building, HX = B.width / 2, HZ = B.depth / 2;
  const R = levelRect(L), y0 = L.elev, y1 = L.elev + L.height;
  if (L.slab > 0) slabPieces(R, voidBoxes(L.id)).forEach(p =>
    b.add('box', 'white', mtx((p.x0 + p.x1) / 2, y0 - L.slab / 2, (p.z0 + p.z1) / 2, p.x1 - p.x0, L.slab, p.z1 - p.z0), L.floor));
  if (L.full && L.walls) {
    b.box('wall', -HX - .12, -HX, y0, y1, -HZ, HZ);
    b.box('wall', HX, HX + .12, y0, y1, -HZ, HZ);
    b.box('wall', -HX, HX, y0, y1, -HZ - .12, -HZ);
  }
  if (L.full && L.facade !== 'none') {
    const segs = [];
    if (L.facade === 'door') {
      const d0 = clamp(B.doorX - B.doorW / 2, -HX, HX), d1 = clamp(B.doorX + B.doorW / 2, -HX, HX);
      segs.push([-HX, d0], [d1, HX]);
      if (d1 - d0 > .1) {
        const tr = Math.min(y0 + 2.8, y1 - .1);
        b.box('glass', d0, d1, tr, y1, HZ - .01, HZ + .01);
        b.box('metal', d0, d1, tr - .05, tr + .05, HZ - .05, HZ + .05);
      }
    } else segs.push([-HX, HX]);
    segs.forEach(([a, c]) => {
      if (c - a < .05) return;
      b.box('glass', a, c, y0, y1, HZ - .01, HZ + .01);
      const n = Math.max(1, Math.round((c - a) / L.mullion));
      for (let i = 0; i <= n; i++) { const x = a + i * (c - a) / n; b.box('metal', x - .045, x + .045, y0, y1, HZ - .05, HZ + .05); }
    });
    b.box('metal', -HX, HX, y1 - .1, y1, HZ - .05, HZ + .05);
    if (L.facade === 'glass') b.box('metal', -HX, HX, y0, y0 + .1, HZ - .05, HZ + .05);
    b.box('led', -HX + .1, HX - .1, y1 - .19, y1 - .13, HZ - .4, HZ - .32);

}
function makeLevelLabel(L) {

  const o = new CSS2DObject(d);

  else o.position.set(R.x1 + 1.2, L.elev + Math.min(1.1, L.height / 2), (R.z0 + R.z1) / 2);

function syncLevels() {
  const ids = new Set(state.levels.map(l => l.id));
  for (const [id, rec] of world.levels) if (!ids.has(id)) {
    if (rec.shell) disposeGroup(rec.shell);
    scene.remove(rec.group); if (rec.label) scene.remove(rec.label);
    world.levels.delete(id);
  }
  for (const L of state.levels) {
    const rec = levelRec(L.id), key = JSON.stringify([L, state.building, voidBoxes(L.id)]);
    if (key === rec.key) continue;
    rec.key = key;
    if (rec.shell) { rec.group.remove(rec.shell); disposeGroup(rec.shell); }
    rec.shell = buildShell(L); rec.group.add(rec.shell);

/* ---------- Fixtures ---------- */
function fxGeoKey(f, L) { const { x, z, rot, label, ...rest } = f; return JSON.stringify(rest) + '|' + r2(L.height) + '|' + styleRev; }
function buildFx(f, L, gk) {
  const g = new THREE.Group(); g.userData.fid = f.id;
  const rec = { group: g, gk, light: null };
  if (f.type === 'light') {
    const pl = new THREE.PointLight(styleColor('led'), 0, Math.max(1, f.range || 16), 2);
    pl.userData = { base: f.power ?? 20, level: f.level }; g.add(pl); world.lights.push(pl); rec.light = pl;
  } else {
    const b = new Builder(g, f);
    try { TYPES[f.type].build(b, f, { ceil: Math.max(.5, L.height - (f.elev || 0)), level: L }); }
    catch (err) { console.warn('Could not build', f.type, err); }
    b.finish();
  }
  levelRec(f.level).group.add(g);
  return rec;
}
function dropFx(rec) {
  if (rec.group.parent) rec.group.parent.remove(rec.group);
  disposeGroup(rec.group);
  if (rec.light) { const i = world.lights.indexOf(rec.light); if (i >= 0) world.lights.splice(i, 1); rec.light.dispose(); }
}
function syncFixtures() {
  const seen = new Set();
  for (const f of state.fixtures) {
    const L = lvl(f.level); if (!L || !TYPES[f.type]) continue;
    seen.add(f.id);
    const gk = fxGeoKey(f, L); let rec = world.fx.get(f.id);
    if (!rec || rec.gk !== gk) { if (rec) dropFx(rec); rec = buildFx(f, L, gk); world.fx.set(f.id, rec); }
    rec.group.position.set(f.x, L.elev + (f.elev || 0), f.z);
    rec.group.rotation.y = rad(f.rot);
  }
  for (const [id, rec] of world.fx) if (!seen.has(id)) { dropFx(rec); world.fx.delete(id); }
}

/* ---------- Hotspot markers ---------- */
function syncHotspots() {
  const skey = JSON.stringify(state.hotspots.map(h => [h.id, h.title]));
  if (skey !== world.hsKey) {
    world.hsKey = skey;
    world.hs.forEach(m => scene.remove(m.obj)); world.hs.clear();
    state.hotspots.forEach((h, i) => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'hs';
      el.innerHTML = `${i + 1}<span class="tip">${esc(h.title)}</span>`;
      el.setAttribute('aria-label', `${i + 1}. ${h.title}`);
      el.addEventListener('pointerdown', e => e.stopPropagation());
      el.addEventListener('click', e => { e.stopPropagation(); onMarker(h.id); });
      const o = new CSS2DObject(el); scene.add(o);
      world.hs.set(h.id, { obj: o, el });

  }
  state.hotspots.forEach(h => { const m = world.hs.get(h.id), L = lvl(h.level); if (m && L) m.obj.position.set(h.x, L.elev + h.y, h.z); });
}

/* ---------- Visibility, walls, selection outline ---------- */
function applyVisibility() {

    const v = levelVisible(L.id); rec.group.visible = v; if (rec.label) rec.label.visible = v;
  }

  MAT.wall.visible = mode !== 'hidden';
  MAT.wall.transparent = !solid; MAT.wall.opacity = solid ? 1 : .16; MAT.wall.depthWrite = solid; MAT.wall.needsUpdate = true;

const selMat = new THREE.LineBasicMaterial({ color: '#ffb46b', depthTest: false, transparent: true });
const selGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
let selLines = [];
function syncSelection3D() {
  selLines.forEach(l => { if (l.parent) l.parent.remove(l); }); selLines = [];
  if (ui.mode !== 'edit') return;
  ui.sel.forEach(id => {
    const rec = world.fx.get(id), f = fxById(id); if (!rec || !f) return;
    const h = Math.max(.1, f.h || .1), l = new THREE.LineSegments(selGeo, selMat);

/* ---------- Camera moves ---------- */
let tween = null;

  const k = Math.min(1, (performance.now() - tween.start) / tween.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);

function hsView(h) {

}
function focusLevel(id = ui.level) {

  const R = levelRect(L), cx = (R.x0 + R.x1) / 2, cz = (R.z0 + R.z1) / 2, span = Math.max(R.x1 - R.x0, R.z1 - R.z0, 6);
  flyTo([cx + span * .45, L.elev + span * .55 + 2, cz + span * .75], [cx, L.elev + .5, cz]);
}
function focusFixture(f) {
  const L = lvl(f.level), y = L.elev + (f.elev || 0);
  flyTo([f.x + 3 + f.w * .4, y + 3 + (f.h || 0), f.z + 4 + f.d * .6], [f.x, y + Math.max(.4, (f.h || 0) / 2), f.z]);
}

/* ---------- Click an object in 3D to select it (edit mode) ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down3 = null;
renderer.domElement.addEventListener('pointerdown', e => { down3 = e.button === 0 ? { x: e.clientX, y: e.clientY } : null; });
renderer.domElement.addEventListener('pointerup', e => {
  const d = down3; down3 = null;
  if (!d || ui.mode !== 'edit' || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const groups = [];
  world.fx.forEach((rec, id) => { const f = fxById(id); if (f && f.type !== 'floorZone' && levelVisible(f.level)) groups.push(rec.group); });
  const hit = ray.intersectObjects(groups, true).find(h => !h.object.isLineSegments && !(h.object.material && h.object.material.transparent && h.object.material.opacity < .5));
  let o = hit && hit.object;

  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (e.code === 'Space') { spaceDown = true; if (!drag) planCv.style.cursor = 'grab'; e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'c') { copySel(); return; }
  if (mod && k === 'v') { e.preventDefault(); pasteClip(); return; }
  if (mod && k === 'a') { e.preventDefault(); setSel(fxOn(ui.level).map(f => f.id)); refreshPanels(); drawPlan(); return; }
  if (mod || e.altKey) return;
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); deleteSel(); return; }
  if (k === 'escape') { setSel([]); applyVisibility(); refreshPanels(); drawPlan(); return; }
  if (k === 'r') { rotateSel(e.shiftKey ? -15 : 15); return; }
  if (k === 'f') { fitPlan(); return; }
  if (k === 'pageup' || k === 'pagedown') { e.preventDefault(); stepLevel(k === 'pageup' ? 1 : -1); return; }
  const arrows = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] };
  if (arrows[k] && (ui.sel.length || ui.selHs)) {
    e.preventDefault();
    const st = (ui.snap ? ui.step : .05) * (e.shiftKey ? 10 : 1);
    nudgeSel(arrows[k][0] * st, arrows[k][1] * st);
  }
});
addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; if (!drag) planCv.style.cursor = ''; } });

const inNum = (key, v, step = .05, extra = '') => `<input type="number" data-key="${esc(key)}" step="${step}" value="${fmt(num(v, 0))}" ${extra}>`;
const inTxt = (key, v, ph = '') => `<input type="text" data-key="${esc(key)}" value="${esc(v ?? '')}" placeholder="${esc(ph)}">`;

// Re-render a panel and keep keyboard focus on the same field

  const a = document.activeElement, key = a && el.contains(a) ? a.dataset.key : null;

}

/* ---------- Applying edits from the panels ---------- */
function setFxProp(f, k, v) {
  const T = TYPES[f.type];
  if (k === 'rot') v = normRot(v);
  else if (k === 'w' || k === 'd') v = Math.max(.05, r2(v));
  else if (k === 'h') v = Math.max(0, r2(v));
  else if (k === 'x' || k === 'z' || k === 'elev') v = r2(v);
  else {
    const s = (T.props || []).find(p => p.k === k);
    if (s && (s.t === 'num' || s.t === 'int' || s.t === 'range')) { v = clamp(v, s.min, s.max); if (s.t === 'int') v = Math.round(v); }
    if (s && s.t === 'sel' && !s.opts.includes(v)) return;
  }
  if (T.rz === 'sq' && (k === 'w' || k === 'd')) { f.w = v; f.d = v; return; }
  f[k] = v;
}
function styleChanged() { applyStyle(); styleRev++; changed(); }
function applyField(el) {
  const key = el.dataset.key, i1 = key.indexOf(':'), scope = key.slice(0, i1), rest = key.slice(i1 + 1);
  let a = rest, b = null;
  if (scope === 'lv') { const i2 = rest.lastIndexOf(':'); a = rest.slice(0, i2); b = rest.slice(i2 + 1); }
  const isNum = el.type === 'number' || el.type === 'range';
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (isNum) { v = Number(v); if (el.value === '' || !isFinite(v)) { refreshPanels(); return; } }
  if (el.tagName === 'SELECT' && v === '') return;
  if (scope === 'fx') {
    const list = selFx(); if (!list.length) return;
    list.forEach(f => setFxProp(f, a, v)); changed();
  } else if (scope === 'lv') {
    const L = lvl(a); if (!L) return;
    if (b === 'rx') L.rect.x = r2(v); else if (b === 'rz') L.rect.z = r2(v);
    else if (b === 'rw') L.rect.w = clamp(r2(v), .5, 400); else if (b === 'rd') L.rect.d = clamp(r2(v), .5, 400);
    else if (b === 'elev') L.elev = r2(v); else if (b === 'height') L.height = clamp(r2(v), .5, 30);
    else if (b === 'slab') L.slab = clamp(r2(v), 0, 3); else if (b === 'mullion') L.mullion = clamp(v, .8, 12);
    else L[b] = v;
    changed();
  } else if (scope === 'b') {
    const B = state.building;
    if (a === 'width' || a === 'depth') B[a] = clamp(r2(v), 4, 400);
    else if (a === 'doorW') B.doorW = clamp(r2(v), .8, 60);
    else B[a] = isNum ? r2(v) : v;
    changed();
    if (a === 'width' || a === 'depth') fitPlan();
  } else if (scope === 'hs') {
    const h = hsById(ui.selHs); if (!h) return;
    if (a === 'items') h.items = String(v).split('\n').map(s => s.trim()).filter(Boolean);
    else if (a === 'x' || a === 'y' || a === 'z') h[a] = r2(v);
    else h[a] = v;
    if (a === 'level') ui.level = v;
    changed();
  } else if (scope === 'st') { if (isHex(v)) { state.style[a] = v; styleChanged(); } }
  else if (scope === 'p') { state[a] = String(v); changed(); }
}
function aabb(f) {
  const cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([p, q]) => toWorld(f, p * f.w / 2, q * f.d / 2));
  return { x0: Math.min(...cs.map(p => p.x)), x1: Math.max(...cs.map(p => p.x)), z0: Math.min(...cs.map(p => p.z)), z1: Math.max(...cs.map(p => p.z)) };
}
function alignSel(mode) {
  const list = selFx(); if (list.length < 2) return;
  const ax = mode[0], side = mode[1], bx = list.map(aabb), k0 = ax + '0', k1 = ax + '1';
  const lo = Math.min(...bx.map(b => b[k0])), hi = Math.max(...bx.map(b => b[k1]));
  const target = side === '0' ? lo : side === '1' ? hi : (lo + hi) / 2;
  list.forEach((f, i) => { const b = bx[i], cur = side === '0' ? b[k0] : side === '1' ? b[k1] : (b[k0] + b[k1]) / 2; f[ax] = r2(f[ax] + target - cur); });
  changed();
}
function distributeSel(ax) {
  const list = selFx().slice().sort((p, q) => p[ax] - q[ax]);
  if (list.length < 3) { toast('Select at least three items to space them evenly'); return; }
  const a = list[0][ax], b = list[list.length - 1][ax];
  list.forEach((f, i) => { f[ax] = r2(a + (b - a) * i / (list.length - 1)); });
  changed();
}
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v, hsel = ui.selHs && hsById(ui.selHs);
  switch (act) {
    case 'addHs': addHotspot(); break;
    case 'selHs': { const h = hsById(id); if (h) { ui.level = h.level; setSel([], id); applyVisibility(); refreshPanels(); drawPlan(); } break; }
    case 'hsUp': moveHotspot(id, -1); break;
    case 'hsDown': moveHotspot(id, 1); break;
    case 'goLevel': setLevel(id); break;
    case 'delLevel': { const L = lvl(id); if (L && confirm(`Delete ${levelName(L)} with its ${fxOn(id).length} items and its hotspots?\nUndo can bring it back.`)) removeLevel(id); break; }
    case 'addFloor': addLevel('floor'); break;
    case 'addMezz': addLevel('mezz'); break;
    case 'styleReset': delete state.style[id]; styleChanged(); break;
    case 'styleResetAll': state.style = {}; styleChanged(); break;
    case 'rot': rotateSel(Number(v)); break;
    case 'dup': duplicateSel(); break;
    case 'copy': copySel(); break;
    case 'del': deleteSel(); break;
    case 'focus': { const f = selFx()[0]; if (f) focusFixture(f); break; }
    case 'clearColor': selFx().forEach(f => { delete f.color; }); changed(); break;
    case 'align': alignSel(v); break;
    case 'dist': distributeSel(v); break;
    case 'hsSaveView': if (hsel) { hsel.view = { pos: camera.position.toArray().map(r2), target: controls.target.toArray().map(r2) }; changed(); toast('Camera view saved for this hotspot'); } break;
    case 'hsAutoView': if (hsel) { hsel.view = null; changed(); } break;
    case 'hsPreview': if (hsel) { const vw = hsView(hsel); flyTo(vw.pos, vw.target); } break;
  }
}
['#left', '#props'].forEach(sel => {
  $(sel).addEventListener('click', onAct);
  $(sel).addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.actSel === 'moveLevel') { if (t.value) moveSelToLevel(t.value); return; }
    if (t.dataset.key) applyField(t);
  });
});
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { ui.tab = b.dataset.tab; refreshPanels(); } };
function renderTabs() {
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  document.querySelectorAll('#left .tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + ui.tab));
}
function refreshPanels() {
  if (!state) return;
  renderTabs(); renderLevelTabs();
  if (ui.tab === 'floors') renderFloors(); else if (ui.tab === 'hs') renderHsTab(); else if (ui.tab === 'style') renderStyle();
  const ll = $('#libLevel'); if (ll) ll.textContent = levelName(lvl(ui.level));
  renderProps();
  const pn = $('#projName'); if (document.activeElement !== pn) pn.value = state.name;
  updateHistoryButtons();
  if (ui.mode === 'present') renderPresenter();
}
function rebuildAll() { applyStyle(); styleRev++; sync(true); refreshPanels(); drawPlan(); }
$('#projName').addEventListener('change', e => { state.name = e.target.value.trim() || 'Untitled layout'; changed(); });
$('#projName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* ---------- Layout: plan / split / 3D ---------- */
(() => {
  const vs3 = document.createElement('div'); vs3.className = 'seg'; vs3.id = 'viewSeg3'; vs3.innerHTML = $('#viewSeg').innerHTML;
  $('#view3d .vbar').prepend(vs3);
  const setView = v => {
    ui.view = v;
    $('#main').classList.toggle('v-plan', v === 'plan'); $('#main').classList.toggle('v-3d', v === '3d');
    document.querySelectorAll('#viewSeg [data-v], #viewSeg3 [data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  };
  ['#viewSeg', '#viewSeg3'].forEach(s => { $(s).onclick = e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); }; });
})();

/* =====================================================================
   11. LIGHTING, PRESENT MODE, CUSTOMER JOURNEY
   ===================================================================== */
const lightState = { t: 0, target: 0 };
const C = {
  dayBg: new THREE.Color('#bdd7ea'), nightBg: new THREE.Color('#0b1224'), daySky: new THREE.Color('#e4f1ff'), nightSky: new THREE.Color('#33447a'),
  dayGround: new THREE.Color('#b8a487'), nightGround: new THREE.Color('#1a130d'),
};
function applyLighting(t) {
  scene.background.lerpColors(C.dayBg, C.nightBg, t); scene.fog.color.copy(scene.background);
  hemi.color.lerpColors(C.daySky, C.nightSky, t); hemi.groundColor.lerpColors(C.dayGround, C.nightGround, t);
  hemi.intensity = lerp(1.25, .16, t); sun.intensity = lerp(2.6, 0, t); moon.intensity = lerp(0, .35, t);
  for (const l of world.lights) { const lv = l.userData.level, on = lv == null || levelVisible(lv) ? 1 : 0; l.intensity = (l.userData.base || 0) * lerp(.22, 1, t) * on; }
  MAT.led.emissiveIntensity = lerp(.35, 3, t); MAT.lamp.emissiveIntensity = lerp(0, 4, t); MAT.win.emissiveIntensity = lerp(0, .9, t);
  SIGN_MATS.forEach(m => { m.emissiveIntensity = lerp(.25, 1.5, t); });
  MAT.glass.opacity = lerp(.18, .1, t); bloom.strength = lerp(0, .7, t); renderer.toneMappingExposure = lerp(1, 1.12, t);
}
function setEvening(on) {
  ui.evening = on; lightState.target = on ? 1 : 0;
  $('#lightBtn').textContent = on ? '☾ Evening' : '☀ Day';
  $('#evening').checked = on;
  $('#lightLbl').textContent = on ? 'Evening · 3000K ambience' : 'Day · architectural study';
}
$('#lightBtn').onclick = () => setEvening(!ui.evening);
$('#evening').onchange = e => setEvening(e.target.checked);
$('#shotBtn').onclick = () => { composer.render(); download(renderer.domElement.toDataURL('image/png'), `3d-view-${new Date().toISOString().slice(0, 10)}.png`); };

const sizeText = () => `${fmt(state.building.width)} m × ${fmt(state.building.depth)} m`;
function visibleUpTo(id) {
  const L = lvl(id), above = levelsSorted().find(x => x.full && x.elev > L.elev + 1e-3), m = {};
  state.levels.forEach(x => { m[x.id] = !above || x.elev < above.elev - 1e-3; });
  return m;
}
function setPresVis(m) {
  state.levels.forEach(L => { presVis[L.id] = m ? !!m[L.id] : true; });
  applyVisibility();
  document.querySelectorAll('#pLevels [data-pl]').forEach(b => b.classList.toggle('on', presVis[b.dataset.pl] !== false));
}
function viewOverview() { const B = state.building, m = Math.max(B.width, B.depth); return { pos: [m * 1.33, m * 1.01, m * 1.49], target: [0, 3, 0] }; }
function presView(key) {
  document.querySelectorAll('#pViews [data-pv]').forEach(b => b.classList.toggle('on', b.dataset.pv === key));
  const B = state.building;
  if (key === 'overview') { setPresVis(null); const v = viewOverview(); flyTo(v.pos, v.target); }
  else if (key === 'street') { setPresVis(null); flyTo([B.doorX, 2.8, B.depth / 2 + Math.max(28, B.width * .75)], [B.doorX, 4, 0]); }
  else if (key.startsWith('lv:')) { const id = key.slice(3); setPresVis(visibleUpTo(id)); focusLevel(id); }
}
function renderPresenter() {
  $('#pTitle').innerHTML = (state.name || '').split(' · ').map(esc).join('<br>');
  $('#pSub').textContent = (state.subtitle || '').replace(/\{size\}/g, sizeText());
  const levels = levelsSorted();
  $('#pViews').innerHTML = `<button type="button" class="chip" data-pv="overview">Overview</button><button type="button" class="chip" data-pv="street">Street view</button>` +
    levels.map(L => `<button type="button" class="chip" data-pv="lv:${esc(L.id)}">${esc(L.name)}</button>`).join('');
  $('#pLevels').innerHTML = levels.map(L => `<button type="button" class="chip${presVis[L.id] !== false ? ' on' : ''}" data-pl="${esc(L.id)}">${esc(L.name)}</button>`).join('');
  let h = '';
  levels.forEach(L => {
    const hs = state.hotspots.filter(x => x.level === L.id); if (!hs.length) return;
    h += `<li class="lv">${esc(levelName(L))}</li>` + hs.map(x => `<li><button type="button" data-poi="${esc(x.id)}"><span class="n">${hsNumber(x)}</span><span>${esc(x.title)}</span></button></li>`).join('');
  });
  $('#poi').innerHTML = h;
}
$('#pViews').onclick = e => { const b = e.target.closest('[data-pv]'); if (b) { stopTour(); presView(b.dataset.pv); } };
$('#pLevels').onclick = e => {
  const b = e.target.closest('[data-pl]'); if (!b) return;
  presVis[b.dataset.pl] = presVis[b.dataset.pl] === false; b.classList.toggle('on', presVis[b.dataset.pl] !== false); applyVisibility();
};
$('#poi').onclick = e => { const b = e.target.closest('[data-poi]'); if (b) { stopTour(); openHotspot(hsById(b.dataset.poi)); } };

function openHotspot(h, tourLabel = '') {
  if (!h) return;
  setPresVis(h.all ? null : visibleUpTo(h.level));
  const v = hsView(h); flyTo(v.pos, v.target);
  document.querySelectorAll('#pViews [data-pv]').forEach(b => b.classList.remove('on'));
  presActive = h.id; applyVisibility();
  $('#iNum').textContent = hsNumber(h); $('#iLevel').textContent = levelName(lvl(h.level));
  $('#iTitle').textContent = h.title; $('#iVn').textContent = h.vn; $('#iText').textContent = h.text;
  $('#iList').innerHTML = h.items.map(i => `<li>${esc(i)}</li>`).join('');
  $('#iTour').textContent = tourLabel;
  $('#info').classList.add('open');
}
function closeInfo() { $('#info').classList.remove('open'); presActive = null; applyVisibility(); }
$('#closeInfo').onclick = () => { stopTour(); closeInfo(); };

let tour = null;
const tourList = () => state.hotspots.filter(h => h.tour);
function tourStep() {
  if (!tour) return;
  const list = tourList();
  if (tour.i >= list.length) { stopTour(); return; }
  openHotspot(list[tour.i], `Customer journey · stop ${tour.i + 1} of ${list.length}`);
  tour.timer = setTimeout(() => { if (!tour) return; tour.i++; tourStep(); }, 6000);
}
function startTour() {
  if (!tourList().length) { toast('No hotspots are in the customer journey'); return; }
  tour = { i: 0, timer: null }; $('#tourBtn').textContent = '■ Stop the journey'; $('#tourBtn').classList.add('playing'); tourStep();
}
function stopTour() {
  if (!tour) return;
  clearTimeout(tour.timer); tour = null;
  $('#tourBtn').textContent = '▶ Walk the customer journey'; $('#tourBtn').classList.remove('playing'); $('#iTour').textContent = '';
}
$('#tourBtn').onclick = () => (tour ? stopTour() : startTour());

function onMarker(id) {
  const h = hsById(id); if (!h) return;
  if (ui.mode === 'present') { stopTour(); openHotspot(h); return; }
  ui.level = h.level; setSel([], id); applyVisibility(); refreshPanels(); drawPlan();
}
function setMode(mode) {
  if (mode === ui.mode) return;
  stopTour(); closeInfo();
  ui.mode = mode;
  document.body.classList.toggle('present', mode === 'present');
  document.querySelectorAll('#modeSeg [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (mode === 'present') { setPresVis(null); renderPresenter(); presView('overview'); }
  else { applyVisibility(); refreshPanels(); }
  drawPlan();
}
$('#modeSeg').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); };
$('#backEdit').onclick = () => setMode('edit');
addEventListener('keydown', e => {
  if (ui.mode !== 'present' || e.key !== 'Escape') return;
  if ($('#info').classList.contains('open')) { stopTour(); closeInfo(); } else setMode('edit');
});

/* =====================================================================
   12. START-UP & RENDER LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let firstFrame = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  stepTween();
  lightState.t += (lightState.target - lightState.t) * Math.min(1, dt * 2.5);
  applyLighting(lightState.t);
  controls.update();
  if (size3d.w > 1 && size3d.h > 1 && view3d.offsetParent !== null) { composer.render(); labelRenderer.render(scene, camera); }
  if (firstFrame) { firstFrame = false; $('#loader').classList.add('done'); }
});

(function init() {
  const { s, restored } = startState();
  state = s;
  ui.level = lvl('g') ? 'g' : levelsSorted()[0].id;
  applyStyle();
  setWalls(ui.walls);
  renderLibrary();
  sync(true);
  commit();
  refreshPanels();
  fitPlan(); drawPlan();
  const v = viewOverview(); camera.position.set(...v.pos); controls.target.set(...v.target); controls.update();
  setEvening(false);
  if (restored) toast('Your last layout was restored from this browser');
})();
</script>
</body>
